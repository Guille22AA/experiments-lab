<!doctype html>
<html lang="{{ idioma }}">
  <head>
    <meta charset="utf-8" />
    <title>{{ textos.titulo_pagina }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/static/style.css?v={{ v }}" />
  </head>
  <body>
    <div class="barra">
      <h1>{{ textos.encabezado }}</h1>
      <div>
        <div class="conjunto" id="conjunto">—</div>
        <div id="conjunto-detalle"></div>
      </div>
      <div class="estado">
        <span id="estado-bot"><span class="punto off"></span>{{ textos.conectando }}</span>
        <span id="ultima">—</span>
        <button id="interruptor">{{ textos.boton_parar_inicial }}</button>
      </div>
    </div>

    <div id="error" class="error" style="display: none"></div>

    <div class="columnas">
      <section class="wallet" id="wallet-crypto"></section>
      <section class="wallet" id="wallet-broker"></section>
    </div>

    <script>const IDIOMA = "{{ idioma }}";</script>
    <script src="/static/app.js?v={{ v }}"></script>
  </body>
</html>
