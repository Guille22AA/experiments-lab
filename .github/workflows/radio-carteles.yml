name: Radio - Convocatorias

on:
  schedule:
    # 04:30 UTC = 06:30 en Madrid en verano (05:30 en invierno)
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carteles
  cancel-in-progress: false

jobs:
  carteles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radio-fase0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-carteles.mjs
      - name: Publicar convocatorias
        working-directory: .
        run: |
          git config user.name "radio-bot"
          git config user.email "radio-bot@users.noreply.github.com"
          git add radio-fase0/data/carteles-auto.json radio-fase0/data/carteles.json
          git diff --staged --quiet || (git commit -m "Convocatorias $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
